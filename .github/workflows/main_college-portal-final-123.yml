name: Build and deploy Node.js app to Azure Web App - college-portal-final-123

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 1. Secret Scanning (Gitleaks)
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Dependency Audit (npm audit)
      - name: Run Dependency Security Audit
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: security_scan  # Only build if security scan passes!
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm install and build
        run: |
          npm install
          # npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Now it correctly waits for 'build'
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EC2A62CFAD1546D2930B683C75204910 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_069B9110D81944999E363F8455494FBE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_098040B1D6F640DE8CAFC43CEF6D5260 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'college-portal-final-123'
          slot-name: 'Production'
          package: .
